[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sky-walker"
version = "0.1.0"
description = "An offline-first personal desktop AI assistant."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["PySide6-Essentials>=6.12,<6.13"]

[project.scripts]
skywalker = "skywalker.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
